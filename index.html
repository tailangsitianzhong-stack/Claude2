<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Saloon Roulette</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0705; }
      #scene { display: block; width: 100vw; height: 100vh; cursor: crosshair; }
      #hud {
        position: fixed; left: 16px; top: 16px; padding: 10px 14px;
        font: 13px/1.6 "Hiragino Sans", "Noto Sans JP", sans-serif; color: #e8d5b0;
        background: rgba(20, 12, 6, 0.6); border: 1px solid rgba(216, 178, 90, 0.35); border-radius: 6px;
        pointer-events: none; user-select: none;
      }
      #status { color: #d8b25a; font-weight: bold; }
      #crosshair {
        position: fixed; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px 0 0 -2px;
        border-radius: 50%; background: rgba(255, 230, 190, 0.6); pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="crosshair"></div>
    <div id="hud">
      <div id="status"></div>
      <div>クリック/ドラッグ:見回す　Esc:マウス解除</div>
      <div>1〜4:席を移動　F:自由移動モード切替</div>
      <div>自由移動中:WASD 移動 / E・Q 上下 / Shift 速く</div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
